[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staunch"
version = "0.1.0.dev0"
description = "Check that a Chialisp contract's published source is the code on chain"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["clvm>=0.9.10", "clvm_tools_rs>=0.1.48"]
keywords = ["chia", "chialisp", "clvm", "verification", "reproducible-builds"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
staunch = "staunch.cli:main"

[project.urls]
Source = "https://github.com/Yarrow-Labs/Staunch"
Documentation = "https://github.com/Yarrow-Labs/Staunch/tree/main/docs"
Changelog = "https://github.com/Yarrow-Labs/Staunch/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["staunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
